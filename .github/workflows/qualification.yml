name: Candidate-bound hosted comparison
on:
  pull_request:
    branches: [qualification-v2]

permissions:
  contents: read

jobs:
  comparison:
    if: github.event.pull_request.head.repo.full_name == github.repository
    name: "${{ matrix.lane }}"
    runs-on: macos-26
    timeout-minutes: 24
    strategy:
      fail-fast: false
      matrix:
        lane: [fast, full]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: '0.10.6'
          python-version: '3.13.9'
          enable-cache: false
      - name: Verify native runner and pin GitHub CLI
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -sm)" = "Darwin arm64"
          device=$(df -P "$RUNNER_TEMP" | awk 'NR==2 {print $1}')
          test "$(diskutil info -plist "$device" | plutil -extract FilesystemType raw -)" = apfs
          gh_asset=gh_2.97.0_macOS_arm64.zip
          pinned=$(mktemp -d "$RUNNER_TEMP/aitm-gh.XXXXXXXX")
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/cli/cli/releases/download/v2.97.0/$gh_asset" -o "$pinned/$gh_asset"
          (cd "$pinned" && printf '%s  %s\n' a58b8fd77b417a38f47a0b54d1370c59b0fcdb324ccc9ca002b0998f7c4c999e "$gh_asset" | shasum -a 256 -c -)
          unzip -q "$pinned/$gh_asset" -d "$pinned"
          echo "$pinned/gh_2.97.0_macOS_arm64/bin" >> "$GITHUB_PATH"
      - name: Run scoped evidence comparison
        shell: bash
        env:
          LANE: ${{ matrix.lane }}
        run: |
          set -euo pipefail
          gh --version
          work=$(mktemp -d "$RUNNER_TEMP/aitm293.XXXXXXXX")
          uv run --no-project --python 3.13.9 python experiment.py "$LANE" "$work" "$RUNNER_TEMP/aitm293-evidence"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: comparison-${{ matrix.lane }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/aitm293-evidence/
          if-no-files-found: error
          retention-days: 14
